firestore_project_env: FIREBASE_PROJECT_ID
timezone: Asia/Ho_Chi_Minh
# ══════════════════════════════════════════════════════════════════════════════════════
# 1/9/2026 — THAY TRỌN 81 KÊNH CŨ BẰNG 10 KÊNH GIẢI THÍCH.
#
# Anh: *"dọn hết các channel cũ hiện tại trên web để làm 10 channel mới."*
#
# Kiểm trước khi thay (luật: nhìn đích trước khi xoá): 81 kênh cũ khai đủ khung YouTube và
# Facebook, nhưng **KHÔNG kênh nào có ID tài khoản thật** — không một `channel_id`,
# `page_id` hay `ig_user_id` nào được điền. Nên thay đi KHÔNG phá kết nối tài khoản nào,
# vì chưa có kết nối nào tồn tại.
#
# Bản cũ giữ trong git (`git show HEAD~1:config/channels.yaml`) và ở
# `/tmp/channels_cu_backup.yaml`. Hoàn tác được bằng một lệnh.
#
# CÒN LẠI, CẦN TAY ANH — hai thứ em không làm được từ máy:
#   · dữ liệu trong Firestore/Drive: cần khoá chỉ có trong GitHub Actions
#   · bảng điều khiển: đòi đăng nhập Google, em không đăng nhập thay anh
# ══════════════════════════════════════════════════════════════════════════════════════
channels:
  HOWLONG:
    display_name: HOW LONG WOULD IT TAKE
    enabled: true
    drive_folder_id_env: HOWLONG_DRIVE_FOLDER_ID
    youtube:
      enabled: true
      client_id_env: HOWLONG_YT_CLIENT_ID
      client_secret_env: HOWLONG_YT_CLIENT_SECRET
      refresh_token_env: HOWLONG_YT_REFRESH_TOKEN
      category_id: '27'          # Education — đúng niche, và là hạng có RPM cao
      default_language: en
      made_for_kids: false
      privacy: public
    facebook:
      enabled: true
      page_id_env: HOWLONG_FB_PAGE_ID
      page_token_env: HOWLONG_FB_PAGE_TOKEN
    instagram:
      enabled: true
      ig_user_id_env: HOWLONG_IG_USER_ID
      ig_token_env: HOWLONG_IG_TOKEN
    branding:
      niche: How long everyday journeys really take, worked out from real speeds and distances
      mau: '#D9622B'
      mau_nen: '#F4EDE0'
      handle: '@howlongusa'
