# ══════════════════════════════════════════════════════════════════════════════════════
# 1/9/2026 — 18 KÊNH GIẢI THÍCH, đủ 18 luồng render song song.
#
# Kiểm trước khi thay 81 kênh cũ: KHÔNG kênh nào có ID tài khoản thật đã điền, nên thay đi
# không phá kết nối nào.
#
# 18 kênh phân biệt nhau ở SÁU trục, đã kiểm tự động không trùng:
#   màu nhận diện 18/18 · nhạc nền 18/18 · sắc thái vẽ 18/18 · biểu tượng 18/18 ·
#   từ trên avatar 18/18 · khoá nhân vật 18/18
# Riêng GIỌNG ĐỌC 11/18 — cố ý. edge-tts chỉ có 17 giọng en-US (đã hỏi API), và quan trọng
# hơn: gán theo ĐỘ HỢP niche đắt hơn gán để không trùng. Giọng nhẹ vui cho kênh sinh tồn
# tệ hơn hai kênh cùng giọng.
# ══════════════════════════════════════════════════════════════════════════════════════
