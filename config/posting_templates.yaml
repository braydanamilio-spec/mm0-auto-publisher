# ============================================================================
#  MM0 — TEMPLATE GÓI ĐĂNG BÀI (chuẩn giờ vàng KHÁN GIẢ MỸ)
# ============================================================================
#  best_times = giờ ĐĂNG theo múi giờ 'timezone' của template (America/New_York).
#  Scheduler tự quy đổi ra giờ tuyệt đối -> đăng đúng lúc khán giả US online,
#  bất kể máy/cron ở múi giờ nào.
#
#  Chọn template: đặt Variable POSTING_TEMPLATE trên GitHub, hoặc
#  'active_template: <tên>' cho từng kênh trong channels.yaml.
#
#  KHUNG GIỜ VÀNG US (giờ ET đã canh sẵn):
#    Shorts: 12:00 (nghỉ trưa) · 17:00 (tan làm) · 20:00 (tối) · 22:00 (khuya)
#    Long  : 15:00 (đăng chiều -> "chín" kịp giờ xem đỉnh 19-22h tối)
#    Cuối tuần: khán giả online sớm hơn -> có thể thêm 10:00.
# ============================================================================

templates:

  # ⭐ MẶC ĐỊNH — đúng ví dụ của anh: 1 LONG + 3 SHORT mỗi ngày
  balanced_1long_3short:
    name: "Cân bằng: 1 Long + 3 Short/ngày ⚖️"
    goal: "Nhịp chuẩn nhất để vừa reach (shorts) vừa giữ chân + kiếm tiền (long)."
    timezone: "America/New_York"
    duration_days: 30
    cadence:
      short_per_day: 3
      long_per_week: 7          # 7 = mỗi ngày 1 long
    best_times:
      short: ["12:00", "17:00", "20:00"]
      long:  ["15:00"]
    notes: "Gói phổ biến & hiệu quả nhất hiện nay cho kênh US kể chuyện/explainer."

  # 🚀 RA MẮT 7 NGÀY — đẩy mạnh nhận diện
  sprint_7d:
    name: "7-Day Launch Sprint 🚀"
    goal: "Kích hoạt kênh, dạy thuật toán, gom subs đầu."
    timezone: "America/New_York"
    duration_days: 7
    cadence:
      short_per_day: 3
      long_per_week: 3
    best_times:
      short: ["12:00", "17:00", "20:00"]
      long:  ["15:00"]
    notes: "Ưu tiên shorts hook mạnh. Không quá 6 shorts/ngày (tránh spam)."

  # 📈 TĂNG TRƯỞNG 30 NGÀY — nhịp bền
  growth_30d:
    name: "30-Day Growth Engine 📈"
    goal: "Xây thói quen xem, đẩy watch-time, lên đề xuất ổn định."
    timezone: "America/New_York"
    duration_days: 30
    cadence:
      short_per_day: 2
      long_per_week: 3
    best_times:
      short: ["17:00", "20:00"]
      long:  ["15:00"]
    notes: "Xen kẽ short kéo view — long giữ chân."

  # 🏆 SCALE 90 NGÀY — uy tín, thư viện sâu
  scale_90d:
    name: "90-Day Authority Scale 🏆"
    goal: "Trở thành kênh top niche, đủ điều kiện kiếm tiền, thư viện nội dung sâu."
    timezone: "America/New_York"
    duration_days: 90
    cadence:
      short_per_day: 1
      long_per_week: 4
    best_times:
      short: ["20:00"]
      long:  ["15:00"]
    notes: "Chất > lượng. Mỗi long là 1 pillar, cắt ra nhiều short."

  # 🔥 CÀY SHORTS — reach tối đa
  shorts_growth:
    name: "Shorts Machine 🔥 (4 short/ngày)"
    goal: "Bùng nổ reach bằng shorts, long duy trì tối thiểu."
    timezone: "America/New_York"
    duration_days: 30
    cadence:
      short_per_day: 4
      long_per_week: 2
    best_times:
      short: ["11:00", "14:00", "18:00", "21:00"]
      long:  ["15:00"]
    notes: "Hợp niche facts/curiosity. Giữ hook 1-2s đầu cực mạnh."

  # 📚 CHIỀU SÂU — 1 long + 1 short mỗi ngày
  authority_daily:
    name: "Authority Daily 📚 (1 Long + 1 Short/ngày)"
    goal: "Kênh chiều sâu, mỗi ngày 1 câu chuyện dài + 1 short dẫn dắt."
    timezone: "America/New_York"
    duration_days: 30
    cadence:
      short_per_day: 1
      long_per_week: 7
    best_times:
      short: ["20:00"]
      long:  ["15:00"]
    notes: "Short nên là trailer/cắt cảnh hay nhất của long trong ngày."

  # 🌙 NHẸ NHÀNG — bền vững ít thời gian
  minimal_sustainable:
    name: "Tối giản bền vững 🌙"
    goal: "Ít công sức, giữ kênh sống, tránh burnout."
    timezone: "America/New_York"
    duration_days: 90
    cadence:
      short_per_day: 1
      long_per_week: 3
    best_times:
      short: ["20:00"]
      long:  ["15:00"]
    notes: "Phù hợp khi làm một mình / kho nội dung có hạn."

  # 🌆 PRIME-TIME US — dồn hết vào khung tối vàng 19–22h ET
  prime_time_us:
    name: "Prime-Time US 🌆"
    goal: "Tối đa view giờ vàng: đăng đúng lúc khán giả Mỹ rảnh xem tối."
    timezone: "America/New_York"
    duration_days: 30
    cadence:
      short_per_day: 3
      long_per_week: 7
    best_times:
      short: ["19:00", "20:30", "22:00"]
      long:  ["19:00"]
    notes: "Hợp kênh giải trí/kể chuyện xem buổi tối. Đừng vượt 4 short/tối."

  # 🔥 SHORTS BLITZ — 5 short/ngày, tối đa reach (chấp nhận nhịp cao)
  shorts_blitz:
    name: "Shorts Blitz x5 🔥"
    goal: "Bơm reach cực mạnh bằng shorts, phủ nhiều khung giờ."
    timezone: "America/New_York"
    duration_days: 14
    cadence:
      short_per_day: 5
      long_per_week: 2
    best_times:
      short: ["11:00", "14:00", "17:00", "20:00", "22:00"]
      long:  ["15:00"]
    notes: "Chỉ dùng khi kho shorts dồi dào. 5/ngày là trần an toàn (không hơn)."

  # ☀️ MIDDAY REACH — khung trưa–chiều (dân văn phòng US nghỉ trưa/tan làm)
  midday_reach:
    name: "Midday Reach ☀️"
    goal: "Bắt lượt xem giờ nghỉ trưa + tan làm sớm."
    timezone: "America/New_York"
    duration_days: 30
    cadence:
      short_per_day: 2
      long_per_week: 5
    best_times:
      short: ["12:00", "16:00"]
      long:  ["13:00"]
    notes: "Hợp nội dung 'xem lúc nghỉ' (mẹo, tài chính, học nhanh)."

  # 🦉 NIGHT OWL — khung khuya (Gen-Z / khán giả xem trước khi ngủ)
  night_owl:
    name: "Night Owl 🦉"
    goal: "Nhắm khán giả trẻ xem khuya 21–24h ET."
    timezone: "America/New_York"
    duration_days: 30
    cadence:
      short_per_day: 3
      long_per_week: 4
    best_times:
      short: ["21:00", "22:30", "23:30"]
      long:  ["21:00"]
    notes: "Hợp nội dung chill/creepy/tâm sự xem trước khi ngủ."

# ============================================================================
#  QUY TẮC AN TOÀN (chống spam / vi phạm chính sách nền tảng)
# ============================================================================
safety_limits:
  youtube_max_uploads_per_day: 6      # trần thực tế do quota API (10.000/1.600)
  facebook_max_uploads_per_day: 10
  min_minutes_between_uploads: 30     # giãn cách để không bị gắn cờ spam
  overflow_policy: "rollover_next_day"  # dư quá trần/ngày -> tự đẩy sang ngày kế
