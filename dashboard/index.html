<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MM0 Auto-Publisher — Dashboard</title>
  <style>
    :root{
      --bg:#0b0d13; --bg2:#0f1219; --card:#151925; --card2:#1b2030;
      --line:#252b3b; --txt:#eef1f7; --mut:#8b93a7; --mut2:#5c6478;
      --accent:#6c5ce7; --accent2:#8e7bff; --grad:linear-gradient(135deg,#6c5ce7,#a66bff);
      --posted:#2ecc71; --pending:#f1c40f; --scheduled:#4aa3ff; --failed:#ff5c6c; --uploading:#b07cff;
      --radius:16px; --shadow:0 8px 30px rgba(0,0,0,.35);
    }
    [data-theme="light"]{
      --bg:#f4f6fb; --bg2:#eef1f7; --card:#ffffff; --card2:#f7f9fd;
      --line:#e3e8f0; --txt:#1a1f2e; --mut:#5c6478; --mut2:#98a0b3;
      --shadow:0 8px 30px rgba(20,30,60,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:var(--scheduled);text-decoration:none}

    /* ---------- LOGIN ---------- */
    #login{min-height:100vh;display:grid;place-items:center;padding:20px}
    .login-card{background:var(--card);border:1px solid var(--line);border-radius:24px;
      padding:48px 40px;text-align:center;max-width:400px;box-shadow:var(--shadow)}
    .logo-badge{width:64px;height:64px;border-radius:18px;background:var(--grad);
      display:grid;place-items:center;font-size:30px;margin:0 auto 20px;box-shadow:0 8px 24px rgba(108,92,231,.4)}
    .login-card h1{font-size:22px;margin-bottom:8px}
    .login-card p{color:var(--mut);font-size:14px;margin-bottom:28px;line-height:1.5}
    .btn-google{width:100%;padding:14px;border:none;border-radius:12px;background:var(--grad);
      color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;
      justify-content:center;gap:10px;transition:transform .15s,box-shadow .15s}
    .btn-google:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(108,92,231,.4)}

    /* ---------- LAYOUT ---------- */
    #app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
    .sidebar{background:var(--bg2);border-right:1px solid var(--line);padding:24px 16px;
      display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
    .brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px}
    .brand .b{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;
      place-items:center;font-size:19px}
    .brand span{font-weight:800;font-size:16px;letter-spacing:-.3px}
    .nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;
      color:var(--mut);font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
    .nav:hover{background:var(--card);color:var(--txt)}
    .nav.active{background:var(--card);color:var(--txt)}
    .nav.active .ic{filter:none;opacity:1}
    .nav .ic{font-size:17px;width:20px;text-align:center}
    .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);
      display:flex;flex-direction:column;gap:8px}
    .user-row{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13px;color:var(--mut)}
    .user-row img{width:30px;height:30px;border-radius:50%}
    .mini-btn{background:var(--card);border:1px solid var(--line);color:var(--mut);
      padding:9px 12px;border-radius:10px;font-size:13px;cursor:pointer;text-align:left}
    .mini-btn:hover{color:var(--txt)}

    main{padding:28px 32px;max-width:1280px}
    .topbar{display:flex;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap}
    .topbar h2{font-size:24px;font-weight:800;letter-spacing:-.5px}
    .topbar .sub{color:var(--mut);font-size:13px}
    .spacer{flex:1}
    select,input[type=search]{background:var(--card);color:var(--txt);border:1px solid var(--line);
      border-radius:10px;padding:10px 13px;font-size:14px;outline:none}
    input[type=search]{min-width:220px}
    select:focus,input:focus{border-color:var(--accent)}
    .pill-live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);
      background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:20px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--posted);box-shadow:0 0 8px var(--posted)}

    /* ---------- KPI ---------- */
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      padding:20px;position:relative;overflow:hidden}
    .kpi .icn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
      font-size:20px;margin-bottom:14px}
    .kpi .n{font-size:32px;font-weight:800;letter-spacing:-1px}
    .kpi .l{font-size:13px;color:var(--mut);margin-top:2px}
    .icn.a{background:rgba(108,92,231,.15)} .icn.g{background:rgba(46,204,113,.15)}
    .icn.b{background:rgba(74,163,255,.15)} .icn.r{background:rgba(255,92,108,.15)}

    /* ---------- SECTIONS ---------- */
    .section-title{font-size:15px;font-weight:700;margin:6px 0 14px;display:flex;align-items:center;gap:8px}
    .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:28px}
    @media(max-width:900px){.grid-2{grid-template-columns:1fr}}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}

    /* channel cards */
    .chan{display:flex;flex-direction:column;gap:14px}
    .chan-row{display:flex;align-items:center;gap:14px}
    .chan-ava{width:40px;height:40px;border-radius:11px;background:var(--card2);display:grid;
      place-items:center;font-weight:800;font-size:15px;border:1px solid var(--line)}
    .chan-info{flex:1}
    .chan-info .nm{font-weight:700;font-size:14px}
    .chan-info .meta{font-size:12px;color:var(--mut)}
    .bar{height:7px;background:var(--card2);border-radius:20px;overflow:hidden;margin-top:7px}
    .bar > i{display:block;height:100%;background:var(--grad);border-radius:20px}

    /* upcoming timeline */
    .up{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto}
    .up-item{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:10px}
    .up-item:hover{background:var(--card2)}
    .up-time{font-size:12px;color:var(--scheduled);font-weight:700;min-width:96px}
    .up-t{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .up-cd{font-size:11px;color:var(--mut);background:var(--card2);padding:3px 8px;border-radius:6px}

    /* ---------- TABLE ---------- */
    .tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
    th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
      background:var(--bg2);position:sticky;top:0}
    tr:last-child td{border-bottom:none}
    tbody tr:hover{background:var(--card2)}
    .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
      font-size:12px;font-weight:600}
    .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .s-posted{background:rgba(46,204,113,.13);color:var(--posted)}
    .s-pending{background:rgba(241,196,15,.13);color:var(--pending)}
    .s-scheduled{background:rgba(74,163,255,.13);color:var(--scheduled)}
    .s-failed{background:rgba(255,92,108,.13);color:var(--failed)}
    .s-uploading{background:rgba(176,124,255,.13);color:var(--uploading)}
    .type{font-size:11px;color:var(--mut);border:1px solid var(--line);padding:2px 8px;border-radius:6px;font-weight:600}
    .warn{color:var(--pending);font-size:11px;margin-top:3px}
    .title-cell{font-weight:600;max-width:360px}
    .link-btn{font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;
      background:var(--card2);border:1px solid var(--line);margin-right:5px}
    .hide{display:none}
    .empty{padding:50px;text-align:center;color:var(--mut)}
    ::-webkit-scrollbar{width:9px;height:9px}
    ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
  </style>
</head>
<body>
  <!-- ============ LOGIN ============ -->
  <div id="login">
    <div class="login-card">
      <div class="logo-badge">📺</div>
      <h1>MM0 Auto-Publisher</h1>
      <p>Trung tâm điều khiển đăng video tự động lên YouTube &amp; Facebook.</p>
      <button class="btn-google" id="signin">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M12 11v2.8h4c-.2 1-1.3 3-4 3-2.4 0-4.4-2-4.4-4.5S9.6 7.8 12 7.8c1.4 0 2.3.6 2.8 1.1l1.9-1.8C15.5 6 13.9 5.3 12 5.3 8.3 5.3 5.3 8.3 5.3 12s3 6.7 6.7 6.7c3.9 0 6.4-2.7 6.4-6.5 0-.4 0-.8-.1-1.2H12z"/></svg>
        Đăng nhập bằng Google
      </button>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="hide">
    <aside class="sidebar">
      <div class="brand"><div class="b">📺</div><span>MM0 Publisher</span></div>
      <div class="nav active" data-view="overview"><span class="ic">📊</span> Tổng quan</div>
      <div class="nav" data-view="videos"><span class="ic">🎬</span> Video</div>
      <div class="nav" data-view="schedule"><span class="ic">🗓️</span> Lịch sắp đăng</div>
      <div class="sidebar-foot">
        <button class="mini-btn" id="themeBtn">🌙 Đổi giao diện</button>
        <div class="user-row" id="userRow"></div>
        <button class="mini-btn" id="signout">↪ Đăng xuất</button>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div>
          <h2 id="viewTitle">Tổng quan</h2>
          <div class="sub" id="viewSub">Toàn bộ kênh</div>
        </div>
        <div class="spacer"></div>
        <div class="pill-live"><span class="dot"></span> <span id="lastsync">Đang kết nối…</span></div>
        <select id="channelFilter"><option value="">Tất cả kênh</option></select>
      </div>

      <!-- OVERVIEW -->
      <section id="view-overview">
        <div class="kpis" id="kpis"></div>
        <div class="grid-2">
          <div class="panel">
            <div class="section-title">🏆 Tiến độ theo kênh</div>
            <div class="chan" id="chanList"></div>
          </div>
          <div class="panel">
            <div class="section-title">⏰ Sắp lên sóng</div>
            <div class="up" id="upcoming"></div>
          </div>
        </div>
      </section>

      <!-- VIDEOS -->
      <section id="view-videos" class="hide">
        <div class="topbar" style="margin-bottom:16px">
          <input type="search" id="search" placeholder="🔍 Tìm theo tiêu đề…" />
          <select id="statusFilter">
            <option value="">Mọi trạng thái</option>
            <option value="posted">Đã đăng</option>
            <option value="scheduled">Đã lên lịch</option>
            <option value="pending">Chờ</option>
            <option value="uploading">Đang upload</option>
            <option value="failed">Lỗi</option>
          </select>
          <select id="typeFilter">
            <option value="">Long &amp; Short</option>
            <option value="long">Long</option>
            <option value="short">Short</option>
          </select>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>Kênh</th><th>Tiêu đề</th><th>Loại</th><th>Trạng thái</th><th>Giờ đăng</th><th>Link</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <!-- SCHEDULE -->
      <section id="view-schedule" class="hide">
        <div class="panel">
          <div class="section-title">🗓️ Toàn bộ lịch đăng (sắp xếp theo giờ)</div>
          <div class="up" id="scheduleList" style="max-height:none"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, query, orderBy }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 🔧 THAY CONFIG NÀY bằng config Web App (Firebase Console > Project settings > Web app).
    const firebaseConfig = {
      apiKey: "PASTE_API_KEY",
      authDomain: "PASTE_PROJECT.firebaseapp.com",
      projectId: "PASTE_PROJECT_ID",
      appId: "PASTE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = (id) => document.getElementById(id);
    let all = [];

    /* ---- theme ---- */
    if (localStorage.theme === "light") document.documentElement.setAttribute("data-theme","light");
    $("themeBtn").onclick = () => {
      const light = document.documentElement.getAttribute("data-theme") === "light";
      if (light){ document.documentElement.removeAttribute("data-theme"); localStorage.theme="dark"; }
      else { document.documentElement.setAttribute("data-theme","light"); localStorage.theme="light"; }
    };

    /* ---- auth ---- */
    $("signin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>alert(e.message));
    $("signout").onclick = () => signOut(auth);
    onAuthStateChanged(auth, (user) => {
      $("login").classList.toggle("hide", !!user);
      $("app").classList.toggle("hide", !user);
      if (user){
        $("userRow").innerHTML =
          `<img src="${user.photoURL||''}" onerror="this.style.display='none'"/> ${user.email}`;
        subscribe();
      }
    });

    /* ---- nav ---- */
    const titles = {overview:["Tổng quan","Toàn bộ kênh"],videos:["Video","Quản lý & tìm kiếm"],schedule:["Lịch sắp đăng","Dòng thời gian"]};
    document.querySelectorAll(".nav").forEach(n => n.onclick = () => {
      document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
      n.classList.add("active");
      const v = n.dataset.view;
      ["overview","videos","schedule"].forEach(x => $("view-"+x).classList.toggle("hide", x!==v));
      $("viewTitle").textContent = titles[v][0]; $("viewSub").textContent = titles[v][1];
    });

    /* ---- data ---- */
    function subscribe(){
      const q = query(collection(db,"videos"), orderBy("publish_at"));
      onSnapshot(q, (snap) => {
        all = snap.docs.map(d => ({id:d.id, ...d.data()}));
        buildChannelFilter(); renderAll();
        $("lastsync").textContent = "Đồng bộ " + new Date().toLocaleTimeString("vi-VN");
      }, (err) => $("lastsync").textContent = "⚠ Lỗi rules: kiểm tra email trong firestore.rules");
    }

    function eff(v){ return v.status==="pending" && v.publish_at ? "scheduled" : v.status; }
    const label = (k)=>({posted:"Đã đăng",scheduled:"Đã lên lịch",pending:"Chờ",uploading:"Đang upload",failed:"Lỗi"}[k]||k);
    const fmt = (iso)=> iso ? new Date(iso).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
    const esc = (s="")=> s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    function countdown(iso){
      const d = new Date(iso) - new Date();
      if (d<=0) return "đến giờ";
      const h = Math.floor(d/3.6e6), m = Math.floor(d%3.6e6/6e4);
      return h>24 ? Math.floor(h/24)+" ngày" : h>0 ? h+"h "+m+"m" : m+" phút";
    }

    function currentChannel(){ return $("channelFilter").value; }
    function scoped(){ const c=currentChannel(); return c ? all.filter(v=>v.channel===c) : all; }

    function buildChannelFilter(){
      const sel=$("channelFilter"), cur=sel.value;
      const ch=[...new Set(all.map(v=>v.channel))].filter(Boolean).sort();
      sel.innerHTML='<option value="">Tất cả kênh</option>'+ch.map(c=>`<option>${c}</option>`).join("");
      sel.value=cur;
    }
    $("channelFilter").onchange = renderAll;
    $("search").oninput = renderVideos;
    $("statusFilter").onchange = renderVideos;
    $("typeFilter").onchange = renderVideos;

    function renderAll(){ renderKPIs(); renderChannels(); renderUpcoming(); renderVideos(); renderSchedule(); }

    function renderKPIs(){
      const d = scoped();
      const c = {total:d.length,posted:0,scheduled:0,failed:0};
      d.forEach(v=>{const s=eff(v); if(s==="posted")c.posted++; else if(s==="scheduled")c.scheduled++; else if(s==="failed")c.failed++;});
      $("kpis").innerHTML = [
        ["a","🎞️",c.total,"Tổng video"],
        ["g","✅",c.posted,"Đã đăng"],
        ["b","🗓️",c.scheduled,"Đã lên lịch"],
        ["r","⚠️",c.failed,"Cần xử lý"],
      ].map(([cl,ic,n,l])=>`<div class="kpi"><div class="icn ${cl}">${ic}</div><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
    }

    function renderChannels(){
      const chans=[...new Set(all.map(v=>v.channel))].filter(Boolean).sort();
      $("chanList").innerHTML = chans.map(c=>{
        const vids=all.filter(v=>v.channel===c);
        const posted=vids.filter(v=>eff(v)==="posted").length;
        const pct= vids.length? Math.round(posted/vids.length*100):0;
        return `<div>
          <div class="chan-row">
            <div class="chan-ava">${esc(c.slice(0,2))}</div>
            <div class="chan-info">
              <div class="nm">${esc(c)}</div>
              <div class="meta">${posted}/${vids.length} đã đăng · ${vids.length-posted} trong hàng đợi</div>
            </div>
            <div style="font-weight:800;font-size:15px">${pct}%</div>
          </div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>`;
      }).join("") || `<div class="empty">Chưa có dữ liệu.</div>`;
    }

    function renderUpcoming(){
      const up = scoped().filter(v=>eff(v)==="scheduled" && v.publish_at)
        .sort((a,b)=>a.publish_at.localeCompare(b.publish_at)).slice(0,8);
      $("upcoming").innerHTML = up.map(v=>`
        <div class="up-item">
          <div class="up-time">${fmt(v.publish_at)}</div>
          <div class="up-t">${esc(v.title||v.drive_name||"")}</div>
          <div class="up-cd">${countdown(v.publish_at)}</div>
        </div>`).join("") || `<div class="empty">Không có video nào đang chờ lịch.</div>`;
    }

    function renderSchedule(){
      const list = scoped().filter(v=>v.publish_at).sort((a,b)=>a.publish_at.localeCompare(b.publish_at));
      $("scheduleList").innerHTML = list.map(v=>`
        <div class="up-item">
          <div class="up-time">${fmt(v.publish_at)}</div>
          <div class="up-t">${esc(v.title||v.drive_name||"")}</div>
          <span class="tag s-${eff(v)}">${label(eff(v))}</span>
        </div>`).join("") || `<div class="empty">Chưa có lịch.</div>`;
    }

    function renderVideos(){
      const term=($("search").value||"").toLowerCase();
      const st=$("statusFilter").value, ty=$("typeFilter").value;
      const rows=scoped().filter(v=>{
        const s=eff(v);
        return (!st||s===st)&&(!ty||v.type===ty)&&(!term||(v.title||v.drive_name||"").toLowerCase().includes(term));
      });
      $("rows").innerHTML = rows.map(v=>{
        const s=eff(v);
        const links=[];
        if(v.results?.youtube?.url) links.push(`<a class="link-btn" href="${v.results.youtube.url}" target="_blank">▶ YT</a>`);
        if(v.results?.facebook?.url) links.push(`<a class="link-btn" href="${v.results.facebook.url}" target="_blank">f FB</a>`);
        const warn=(v.warnings?.length)?`<div class="warn">⚠ ${v.warnings.length} cảnh báo chính sách</div>`:"";
        return `<tr>
          <td>${esc(v.channel||"")}</td>
          <td class="title-cell">${esc(v.title||v.drive_name||"")}${warn}</td>
          <td><span class="type">${(v.type||"").toUpperCase()}</span></td>
          <td><span class="tag s-${s}">${label(s)}</span></td>
          <td style="color:var(--mut)">${fmt(v.publish_at)}</td>
          <td>${links.join("")||"—"}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="6" class="empty">Không có video khớp bộ lọc.</td></tr>`;
    }
  </script>
</body>
</html>
