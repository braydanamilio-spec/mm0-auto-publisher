name = "mm0-connect"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# App ID Facebook (CÔNG KHAI — không phải secret). App Secret đặt riêng bằng wrangler secret.
[vars]
# Repo nhận nhịp render. KHÔNG phải bí mật (tên repo công khai) nên để ở đây,
# anh chỉ còn phải nạp GH_TOKEN.
GH_REPO = "braydanamilio-spec/mq-vx-lab"
FB_APP_ID = "3317605138408247"

# Secrets (KHÔNG ghi giá trị ở đây) — đặt bằng: wrangler secret put <TÊN>
#   YT_CLIENT_ID        (OAuth client "Web application" client_id)
#   YT_CLIENT_SECRET
#   SA_CLIENT_EMAIL     (service account email: ...@...iam.gserviceaccount.com)
#   SA_PRIVATE_KEY      (private_key trong file JSON service account, cả -----BEGIN...-----)
#   FIREBASE_PROJECT_ID (mm0-auto-publisher)
#   ALLOW_EMAIL         (tuỳ chọn: chỉ email này mới được kết nối)

# 23/8: KV lưu bản sao thẻ kết nối (refresh_token) — khi Firestore project A hết quota đọc (429)
# worker vẫn lấy được token để đẩy Drive/đăng bài. Đây là lá chắn chống lặp lại sự cố 180 video.
[[kv_namespaces]]
binding = "MM0_CACHE"
id = "3c2d6c85ed4d498ea83a2ea706c25e72"

# 24/8 — D1 "mm0-hot": chuyển các bảng NÓNG khỏi Firestore.
# Hạn mức free: 5.000.000 dòng ĐỌC/ngày (Firestore 50.000 -> 100×) · 100.000 dòng GHI (5×) · 5 GB.
# Chỉ chứa thứ đọc/ghi nhiều mà KHÔNG cần realtime, KHÔNG cần rules trình duyệt.
# Dashboard vẫn ở Firestore vì nó sống nhờ hai thứ đó.
[[d1_databases]]
binding = "HOT"
database_name = "mm0-hot"
database_id = "feb1cd95-1113-4f26-a136-27ffe42d63d7"

# NHỊP RENDER (27/8/2026) — xem chú thích `scheduled()` trong src/worker.js.
# GitHub bỏ bớt cron tần suất cao trên repo free: workflow khai */10 mà thực tế chỉ bắn 4-6
# lượt/ngày. Cloudflare bắn đúng giờ, nên để nó giữ nhịp.
# 30 phút/lượt = 48 lượt/ngày. Phiên trước còn chạy thì `concurrency` của workflow tự xếp hàng,
# không chồng phiên — nên bắn dày hơn nhịp thật cũng không hại.
[triggers]
crons = ["*/30 * * * *"]
