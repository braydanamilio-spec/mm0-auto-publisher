name: MM0 Storage Cleanup

# ============================================================================
#  Dọn dẹp _POSTED theo storage.yaml:
#   - cleanup.trigger = auto  -> job này chạy mỗi ngày và dọn theo policy.
#   - cleanup.trigger = manual-> anh tự bấm "Run workflow", hoặc chạy local
#                                 python src/cleanup.py --now
#  (Nếu mode = keep thì cleanup.py tự bỏ qua, không xoá gì.)
# ============================================================================

on:
  # ⛔ CRON ĐÃ CHUYỂN sang repo PUBLIC mq-vx-lab (free vô hạn). Ở đây chỉ chạy tay.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử (không xoá)"
        type: boolean
        default: false
      now:
        description: "Dọn ngay, bỏ qua keep_days"
        type: boolean
        default: false

concurrency:
  group: mm0-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ghi service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
      - name: Cleanup
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # ---- tài khoản pool (thêm store3, store4... nếu có) ----
          STORE1_FOLDER_ID:         ${{ secrets.STORE1_FOLDER_ID }}
          STORE1_DRIVE_CLIENT_ID:   ${{ secrets.STORE1_DRIVE_CLIENT_ID }}
          STORE1_DRIVE_CLIENT_SECRET: ${{ secrets.STORE1_DRIVE_CLIENT_SECRET }}
          STORE1_DRIVE_REFRESH_TOKEN: ${{ secrets.STORE1_DRIVE_REFRESH_TOKEN }}
          STORE2_FOLDER_ID:         ${{ secrets.STORE2_FOLDER_ID }}
          STORE2_DRIVE_CLIENT_ID:   ${{ secrets.STORE2_DRIVE_CLIENT_ID }}
          STORE2_DRIVE_CLIENT_SECRET: ${{ secrets.STORE2_DRIVE_CLIENT_SECRET }}
          STORE2_DRIVE_REFRESH_TOKEN: ${{ secrets.STORE2_DRIVE_REFRESH_TOKEN }}
          # ---- kho lạnh backup ----
          BACKUP_FOLDER_ID:         ${{ secrets.BACKUP_FOLDER_ID }}
          BACKUP_DRIVE_CLIENT_ID:   ${{ secrets.BACKUP_DRIVE_CLIENT_ID }}
          BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_DRIVE_CLIENT_SECRET }}
          BACKUP_DRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_DRIVE_REFRESH_TOKEN }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ github.event.inputs.now }}" = "true" ] && ARGS="$ARGS --now"
          python src/cleanup.py $ARGS
