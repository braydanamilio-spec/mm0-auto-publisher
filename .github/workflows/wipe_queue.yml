name: MM0 Wipe Queue

# ============================================================================
#  DỌN SẠCH _QUEUE (hàng chờ đăng) trên MỌI kho.
#
#  30/8/2026 — anh yêu cầu xoá toàn bộ video 50 kênh để dựng lại theo kiểu mới.
#  `src/wipe_queue.py` đã có sẵn từ 23/8 nhưng CHƯA CÓ WORKFLOW NÀO CHẠY NÓ, nên
#  cách duy nhất là chạy tay trên máy có khoá — mà máy của anh không có khoá.
#
#  HAI HÀNG RÀO, cả hai đều cố ý:
#   · `dry_run` MẶC ĐỊNH TRUE — bấm nhầm nút thì chỉ đếm, không mất gì.
#   · `wipe_queue.py` bỏ file vào THÙNG RÁC Drive, không xoá vĩnh viễn:
#     còn cứu lại được trong 30 ngày.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử — chỉ đếm, KHÔNG đụng file"
        type: boolean
        default: true
      scope:
        description: "queue = chỉ hàng chờ đăng · store = mọi thứ trong kho"
        type: choice
        options: [queue, store]
        default: queue

concurrency:
  group: mm0-wipe-queue
  cancel-in-progress: false

jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt
      - name: Ghi service account key
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json
          echo '${{ secrets.GCP_SA_KEY_C }}' > /tmp/sa_c.json
      - name: Wipe queue
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C: ${{ secrets.FIREBASE_PROJECT_ID_C }}
          SHARD_PUBLISH: ${{ vars.SHARD_PUBLISH }}   # =1 khi đã migrate publish sang C
          # ---- tài khoản pool (thêm store3, store4... nếu có) ----
          STORE1_FOLDER_ID:         ${{ secrets.STORE1_FOLDER_ID }}
          STORE1_DRIVE_CLIENT_ID:   ${{ secrets.STORE1_DRIVE_CLIENT_ID }}
          STORE1_DRIVE_CLIENT_SECRET: ${{ secrets.STORE1_DRIVE_CLIENT_SECRET }}
          STORE1_DRIVE_REFRESH_TOKEN: ${{ secrets.STORE1_DRIVE_REFRESH_TOKEN }}
          STORE2_FOLDER_ID:         ${{ secrets.STORE2_FOLDER_ID }}
          STORE2_DRIVE_CLIENT_ID:   ${{ secrets.STORE2_DRIVE_CLIENT_ID }}
          STORE2_DRIVE_CLIENT_SECRET: ${{ secrets.STORE2_DRIVE_CLIENT_SECRET }}
          STORE2_DRIVE_REFRESH_TOKEN: ${{ secrets.STORE2_DRIVE_REFRESH_TOKEN }}
          # ---- kho lạnh backup ----
          BACKUP_FOLDER_ID:         ${{ secrets.BACKUP_FOLDER_ID }}
          BACKUP_DRIVE_CLIENT_ID:   ${{ secrets.BACKUP_DRIVE_CLIENT_ID }}
          BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_DRIVE_CLIENT_SECRET }}
          BACKUP_DRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_DRIVE_REFRESH_TOKEN }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ github.event.inputs.now }}" = "true" ] && ARGS="$ARGS --now"
          python src/cleanup.py $ARGS
        run: |
          python src/wipe_queue.py \
            --scope "${{ inputs.scope }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
