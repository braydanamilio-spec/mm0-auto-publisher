name: MM0 Social Publisher (FB + Instagram)

# ============================================================================
#  ĐĂNG FACEBOOK + INSTAGRAM — TÁCH RIÊNG YouTube (cơ chế khác nhau).
#  Token FB/IG nằm ở Firestore (kết nối qua dashboard) -> chỉ cần SA key.
#  Video FB/IG do FB/IG TỰ KÉO từ link Drive công khai tạm -> nhẹ, không tải-lại.
#  Repo PUBLIC = phút Actions không giới hạn.
# ============================================================================

on:
  schedule:
    - cron: "15,45 * * * *"   # lệch 15' so với YouTube để không chạy chồng
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử (không đăng)"
        type: boolean
        default: false

concurrency:
  group: mm0-social
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Ghi service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
      - name: Đăng FB + Instagram
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python src/publish_social.py --dry-run
          else
            python src/publish_social.py
          fi
