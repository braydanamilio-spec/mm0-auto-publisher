name: MM0 Social Publisher (FB + Instagram)

# ============================================================================
#  ĐĂNG FACEBOOK + INSTAGRAM — TÁCH RIÊNG YouTube (cơ chế khác nhau).
#  Token FB/IG nằm ở Firestore (kết nối qua dashboard) -> chỉ cần SA key.
#  Video FB/IG do FB/IG TỰ KÉO từ link Drive công khai tạm -> nhẹ, không tải-lại.
#  Repo PUBLIC = phút Actions không giới hạn.
# ============================================================================

on:
  # ⛔ CRON ĐÃ CHUYỂN sang repo PUBLIC mq-vx-lab (free vô hạn). Ở đây chỉ chạy tay.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử (không đăng)"
        type: boolean
        default: false

concurrency:
  group: mm0-social
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Ghi service account key
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo '${{ secrets.GCP_SA_KEY_B }}' > /tmp/sa_b.json   # render_jobs -> Project B
          echo '${{ secrets.GCP_SA_KEY_C }}' > /tmp/sa_c.json   # publish owned -> Project C
      - name: Đăng FB + Instagram
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_B: /tmp/sa_b.json
          FIREBASE_PROJECT_ID_B: ${{ secrets.FIREBASE_PROJECT_ID_B }}
          GOOGLE_APPLICATION_CREDENTIALS_C: /tmp/sa_c.json
          FIREBASE_PROJECT_ID_C: ${{ secrets.FIREBASE_PROJECT_ID_C }}
          SHARD_PUBLISH: ${{ vars.SHARD_PUBLISH }}   # =1 khi đã migrate publish sang C
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python src/publish_social.py --dry-run
          else
            python src/publish_social.py
          fi
